<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The museum image server refuses requests that carry a referrer. -->
  <meta name="referrer" content="no-referrer">
  <title>freeSaver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tiny looping silent video: an active media pipeline is what stops
       webOS from starting its own screensaver over still images. -->
  <video id="keepawake" src="keepawake.mp4" muted loop playsinline autoplay></video>

  <div id="frame"></div>

  <div id="stage">
    <div class="slide" id="slideA"><div class="backdrop"></div><img alt=""></div>
    <div class="slide" id="slideB"><div class="backdrop"></div><img alt=""></div>
  </div>

  <div id="dimmer"></div>
  <div id="caption"><div id="capTitle"></div><div id="capSub"></div></div>
  <div id="clock"></div>
  <div id="message"></div>

  <div id="menu">
    <div id="menuTitle">freeSaver</div>
    <div id="menuList"></div>
    <div id="menuTotal"></div>
    <div id="menuHint">OK to tick or untick &nbsp;&middot;&nbsp; Back to close</div>
  </div>

  <script src="config.js"></script>
  <script src="frame.js"></script>
  <script src="generative.js"></script>
  <script src="app.js"></script>
</body>
</html>
